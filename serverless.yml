# "org" ensures this Service is used with the correct Serverless Framework Access Key.
org: kevit
# "service" is the name of this project. This will also be added to your AWS resource names.
service: temp

plugins: 
  - serverless-offline

provider:
  name: aws
  runtime: nodejs20.x
  # Uncomment to easily set up a custom domain. Read the docs for more details:
  # https://www.serverless.com/framework/docs/providers/aws/guide/domains
  # domain: api.example.com

functions:
  hello:
    handler: handler.hello
    events:
      - httpApi:
          path: /
          method: get

  createItem:
    handler: src/create.createItem
    events:
      - httpApi:
          path: /items
          method: post

  getItem:
    handler: src/read.getItem
    events:
      - httpApi:
          path: /items/{id} 
          method: get

  getItems:
    handler: src/read.getItems
    events:
      - httpApi:
          path: /items
          method: get

  updateItem:
    handler: src/update.updateItem
    events:
      - httpApi:
          path: /items/{id}
          method: put

  deleteItem:
    handler: src/delete.deleteItem
    events:
      - httpApi:
          path: /items/{id}
          method: delete
